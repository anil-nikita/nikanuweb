<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 – Page Not Found | NIKANUWEB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #27254a;
      --ink-deep: #14122b;
      --muted: #55536f;
      --accent: #7c6cf5;
      --red: #d9534f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--ink-deep);
      background: linear-gradient(160deg, #efeeff 0%, #e4e0ff 45%, #d8d1fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow: hidden;
    }
    /* soft glow top-right like the reference */
    body::before {
      content: "";
      position: absolute;
      top: -140px; right: -120px;
      width: 460px; height: 460px;
      background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
      pointer-events: none;
    }
    main {
      position: relative;
      text-align: center;
      max-width: 640px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,.75);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      margin-bottom: 36px;
    }
    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      font-size: clamp(120px, 26vw, 230px);
      line-height: 1;
      color: var(--ink);
      margin-bottom: 18px;
    }
    .radar {
      width: .72em;
      height: .72em;
      flex-shrink: 0;
      overflow: visible;
    }
    .sweep {
      transform-origin: 75px 75px;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      font-size: clamp(34px, 6vw, 52px);
      letter-spacing: -1.5px;
      color: var(--ink-deep);
      margin-bottom: 14px;
    }
    p.desc {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      max-width: 430px;
      margin: 0 auto 28px;
    }
    p.thanks {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 26px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px; height: 28px;
      background: rgba(255,255,255,.65);
      border-radius: 999px;
      margin-bottom: 22px;
    }
    .status span {
      width: 8px; height: 8px;
      background: var(--red);
      border-radius: 50%;
      margin-right: 14px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 15px;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(39,37,74,.18); }
    .btn-dark { background: var(--ink-deep); color: #fff; }
    .btn-light { background: #fff; color: var(--ink-deep); border-color: #e2dffa; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Error 404</span>

    <div class="code" aria-label="404">
      <span>4</span>
      <svg class="radar" viewBox="0 0 150 150" role="img" aria-label="Radar">
        <defs>
          <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c6cf5" stop-opacity=".35" />
            <stop offset="1" stop-color="#7c6cf5" stop-opacity=".15" />
          </linearGradient>
          <clipPath id="disc"><circle cx="75" cy="75" r="53" /></clipPath>
        </defs>
        <!-- outer ring -->
        <circle cx="75" cy="75" r="62" fill="#f3f2ff" stroke="#27254a" stroke-width="18" />
        <g clip-path="url(#disc)">
          <!-- rings -->
          <circle cx="75" cy="75" r="14" fill="none" stroke="#cfc9f7" stroke-width="1" />
          <circle cx="75" cy="75" r="30" fill="none" stroke="#d9d4fa" stroke-width="1" />
          <circle cx="75" cy="75" r="46" fill="none" stroke="#e1ddfb" stroke-width="1" />
          <!-- crosshair -->
          <line x1="75" y1="10" x2="75" y2="140" stroke="#dcd7fa" stroke-width="1" />
          <line x1="10" y1="75" x2="140" y2="75" stroke="#dcd7fa" stroke-width="1" />
          <!-- rotating sweep -->
          <g class="sweep">
            <path d="M75 75 L75 22 A53 53 0 0 0 22 75 Z" fill="url(#wedge)" />
            <line x1="75" y1="75" x2="75" y2="24" stroke="#7c6cf5" stroke-width="2.5" stroke-linecap="round" />
          </g>
        </g>
        <!-- target -->
        <circle class="blip" cx="54" cy="98" r="5" fill="#d9534f" />
      </svg>
      <span>4</span>
    </div>

    <h1>Page Not Found!</h1>
    <p class="desc">
      Sorry, the page you are looking for is not available or may have been moved.
      Please visit our homepage or explore our services to find what you need.
    </p>
    <p class="thanks">Thank you for visiting NIKANUWEB!</p>

    <div class="status" aria-hidden="true"><span></span></div>

    <div class="actions">
      <a class="btn btn-dark" href="/">Back to Home ↗</a>
      <a class="btn btn-light" href="/#services">Our Services</a>
    </div>
  </main>
</body>
</html>
